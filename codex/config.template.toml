# Codex config template for VCO ecosystem
# Copy to ~/.codex/config.toml and fill in your credentials

model = "gpt-5-codex"
model_reasoning_effort = "high"
approval_policy = "untrusted"

# Uncomment and configure your provider:

# [model_providers.openai]
# name = "OpenAI"
# env_key = "OPENAI_API_KEY"

# [model_providers.azure]
# name = "Azure OpenAI"
# base_url = "https://YOUR-ENDPOINT.openai.azure.com/openai/v1"
# env_key = "AZURE_OPENAI_API_KEY"
# wire_api = "responses"

# MCP servers shared with Claude Code
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = {"GITHUB_PERSONAL_ACCESS_TOKEN" = "ghp_YOUR_TOKEN"}
